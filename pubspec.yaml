name: doutor_ie_test
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  dio: ^5.4.3
  get_it: ^7.6.7
  go_router: ^14.1.4
  intl: ^0.20.2
  logger: ^2.4.0
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^9.2.4
  brasil_fields: ^1.15.2
  shared_preferences: ^2.3.2
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true
  assets:
    - .env


